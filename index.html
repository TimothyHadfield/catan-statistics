<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1117">
<title>Catan — Timothy Hadfield</title>
<meta name="description" content="Play base Catan against measured computer players or friends online, with corner odds, plus the dice tracker for real tables.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/table.css?v=1">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 6.3v13.4L16 29 5 22.7V9.3z" fill="#e2b845" stroke="#7a5a1c" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="16" r="5.4" fill="#f3e7c9" stroke="#7a5a1c" stroke-width="1.2"/><path d="M14.6 13.6h2.6v5.2" fill="none" stroke="#b8321f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Catan</span></div>
    <nav class="tabs-top" id="tabsTop" aria-label="Sections"></nav>
    <span class="ver">v2.0</span>
  </header>
  <main id="main" class="tbl-surface tbl-wood-dark">
    <div id="playView" class="play">
      <section class="seats" id="seats" aria-label="Other players" hidden></section>
      <section class="board-col"><div class="board-wrap" id="boardWrap">
        <svg id="board" role="img" aria-label="Catan board" viewBox="-224 -194 448 388"><g id="static"></g><g id="live"></g></svg>
        <div class="zoom-bar"><button class="zoom fit" id="fitBtn" aria-label="Fit whole board"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="zoom" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button><button class="zoom" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
      </div></section>
      <section class="panel-col" id="panel"></section>
      <section class="mine" id="mine" aria-label="Your hand" hidden></section>
    </div>
    <div id="trackerView" class="tracker" hidden><iframe id="trackerFrame" title="Dice tracker and board builder"></iframe></div>
    <div id="settingsView" class="settings-view" hidden></div>
  </main>
  <nav class="tabs-bottom" id="tabsBottom" aria-label="Sections"></nav>
</div>
<div class="sheet-back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="js/engine.js?v=1"></script>
<script src="js/ai.js?v=1"></script>
<script src="js/adapter.js?v=1"></script>
<script src="js/strength.js?v=1"></script>
<script src="js/fx.js?v=1"></script>
<script src="js/table.js?v=1"></script>
<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
